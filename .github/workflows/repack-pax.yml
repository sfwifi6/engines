name: 重打包PAX引擎

# 背景：clang/golang/openjdk 三个包是 PAX 格式（每个文件前带 @PaxHeader 扩展头），
# App 内置解压器处理 PAX 会中途中断（只解出几百个条目），导致「引擎包不完整」。
# 本 workflow 把这三个包解压后用 ustar（失败则 gnu）重新打包，输出 -ustar 后缀的新资产。

on:
  push:
    branches: [main]
    paths:
      - 'trigger/repack.txt'

permissions:
  contents: write

env:
  TAG: 'v1'

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        engine: [clang, golang, openjdk]
    steps:
      - name: 下载原包
        run: |
          set -uo pipefail
          URL="https://github.com/sfwifi6/engines/releases/download/${TAG}/${{ matrix.engine }}-engine.tar.gz"
          echo "下载 $URL"
          curl -sL --retry 3 --retry-delay 3 -o old.tar.gz "$URL"
          ls -l old.tar.gz
          test -s old.tar.gz

      - name: 解压
        run: |
          set -uo pipefail
          mkdir -p work
          tar -xzf old.tar.gz -C work
          echo "--- 顶层 ---"
          ls work
          echo "--- manifest ---"
          head -c 400 work/manifest.json || true
          echo ""
          echo "--- 最长路径 ---"
          find work \( -type f -o -type l \) | awk '{print length($0), $0}' | sort -rn | head -3

      - name: 重打包
        run: |
          set -uo pipefail
          cd work
          if tar --format=ustar --mtime='2026-01-01 00:00:00' --owner=0 --group=0 --numeric-owner -czf ../new.tar.gz ./manifest.json ./data 2>../err.txt; then
            echo "格式: ustar"
          else
            echo "ustar 失败，改用 gnu："
            cat ../err.txt
            tar --format=gnu --mtime='2026-01-01 00:00:00' --owner=0 --group=0 --numeric-owner -czf ../new.tar.gz ./manifest.json ./data
            echo "格式: gnu"
          fi
          cd ..
          ls -l new.tar.gz
          SZ=$(stat -c%s new.tar.gz)
          MD=$(md5sum new.tar.gz | cut -d' ' -f1)
          echo "SIZE=$SZ" >> "$GITHUB_ENV"
          echo "MD5=$MD" >> "$GITHUB_ENV"
          echo "### ${{ matrix.engine }}  size=$SZ  md5=$MD" >> "$GITHUB_STEP_SUMMARY"

      - name: 校验新包
        run: |
          set -uo pipefail
          echo "--- 条目数 ---"
          tar -tzf new.tar.gz | wc -l
          echo "--- 扩展头检查 ---"
          python3 -c "import zlib;d=open('new.tar.gz','rb').read();r=zlib.decompressobj(16+zlib.MAX_WBITS).decompress(d);print('!!! 仍有 PAX 头' if b'PaxHeader' in r[:400000] else 'OK 无 PAX 头')"
          echo "--- 关键主程序 ---"
          tar -tzf new.tar.gz | grep -E 'usr/bin/(clang|clang\+\+|gcc|g\+\+|go|javac|java)$' | head -12 || true
          echo "--- manifest ---"
          tar -xzf new.tar.gz -O ./manifest.json 2>/dev/null | head -c 400 || true

      - name: 上传新资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          NEW="${{ matrix.engine }}-engine-ustar.tar.gz"
          cp new.tar.gz "$NEW"
          echo "上传 $NEW  ($SIZE bytes, md5=$MD5)"
          gh release upload "$TAG" "$NEW" --clobber
          echo "=== 上传完成 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name|contains("ustar")) | "\(.name)  \(.size) bytes"'
          echo "### ${{ matrix.engine }} 到 $NEW  size=$SIZE  md5=$MD5" >> "$GITHUB_STEP_SUMMARY"
