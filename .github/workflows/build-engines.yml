name: 构建引擎包

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'trigger/build.txt'
  workflow_dispatch:
    inputs:
      engines:
        description: '只构建这些引擎（逗号分隔，留空=全部）'
        required: false
        default: ''

permissions:
  contents: write

env:
  TERMUX_MIRROR: 'https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main'
  TAG: 'v1'
  CACHE_VER: 'v2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        engine:
          - rust
          - sqlite
          - nginx
          - redis
          - ssh
          - vim
          - sysbase
          - nodejs
          - php
          - kotlin
          - mysql
          - ai
          - aiagent
          - mpweixin
          - mpdouyin
          - mpalipay
          - apkbuild
          - git
          - aapt
          - aapt2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 判断是否需要构建
        id: need
        run: |
          E="${{ github.event.inputs.engines }}"
          if [ -z "$E" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          case ",$E," in
            *",${{ matrix.engine }},"*) echo "go=1" >> "$GITHUB_OUTPUT";;
            *) echo "go=0" >> "$GITHUB_OUTPUT";;
          esac

      - name: 缓存 deb
        if: steps.need.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: build/cache
          key: ${{ env.CACHE_VER }}-deb-${{ matrix.engine }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VER }}-deb-${{ matrix.engine }}-

      - name: 构建 ${{ matrix.engine }}
        if: steps.need.outputs.go == '1'
        working-directory: build
        run: |
          df -h / | tail -1
          rm -rf cache
          python3 build_engine.py ${{ matrix.engine }}
          echo "--- 产物 ---"
          ls -la *.tar.gz
          cat ${{ matrix.engine }}-info.json

      - name: 校验包内容
        if: steps.need.outputs.go == '1'
        working-directory: build
        run: |
          set -uo pipefail
          mkdir -p /tmp/chk && tar xzf ${{ matrix.engine }}-engine.tar.gz -C /tmp/chk
          U=/tmp/chk/data/data/com.termux/files/usr
          echo "=== bin ==="
          ls -la $U/bin/ | head -30
          echo "=== lib 数量 ==="
          ls $U/lib/ | wc -l
          echo "=== 关键二进制 NEEDED 对照 ==="
          for B in aapt zipalign aapt2; do
            BIN="$U/bin/$B"
            [ -f "$BIN" ] || continue
            echo "--- $B ---"
            for n in $(readelf -d "$BIN" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
              case "$n" in
                libc.so|libdl.so|libm.so|liblog.so|libandroid.so) echo "  SYS  $n";;
                *) if [ -e "$U/lib/$n" ]; then echo "  OK   $n"; else echo "  MISS $n"; fi;;
              esac
            done
          done

      - name: 上传产物
        if: steps.need.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.engine }}
          path: |
            build/*-engine.tar.gz
            build/*-info.json
          retention-days: 7
          compression-level: 0

  # html / androidapp 不是 Termux 包，单独构建
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建 html / androidapp
        working-directory: build
        run: |
          python3 make_extra.py all
          echo "--- 产物 ---"
          ls -la out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pkg-extra
          path: |
            build/out/*-engine.tar.gz
            build/out/*-info.json
          retention-days: 7
          compression-level: 0

  release:
    needs: [build, extra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: 清单
        run: |
          echo "=== 构建结果 ==="
          ls -la dist/ || true
          echo ""
          echo "=== 各引擎大小 ==="
          for f in dist/*-engine.tar.gz; do
            [ -f "$f" ] || continue
            printf "%-28s %10d bytes\n" "$(basename $f)" "$(stat -c%s "$f")"
          done

      - name: 发布到 Release
        if: hashFiles('dist/*-engine.tar.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "引擎包 $TAG" --notes "编程专家 APP 引擎安装包"
          fi
          for f in dist/*-engine.tar.gz; do
            [ -f "$f" ] || continue
            echo "↑ $(basename $f)  $(stat -c%s "$f") bytes"
            gh release upload "$TAG" "$f" --clobber && echo "   OK" || echo "   FAIL"
          done
          echo ""
          echo "=== Release 资产 ==="
          gh release view "$TAG"

      - name: 合并汇总清单
        if: always()
        run: |
          python3 - <<'PY'
          import os, json, hashlib, glob
          # 先读仓库里已有的清单，保留这次没构建的引擎
          old = {}
          if os.path.exists('built/summary.json'):
              try:
                  old = json.load(open('built/summary.json', encoding='utf-8'))
                  print(f'已有清单 {len(old)} 个引擎，本次只更新构建出来的')
              except Exception as e:
                  print(f'旧清单读取失败（忽略）：{e}')
          out = dict(old)
          new = []
          for f in sorted(glob.glob('dist/*-engine.tar.gz')):
              n = os.path.basename(f).replace('-engine.tar.gz', '')
              h = hashlib.md5(open(f, 'rb').read()).hexdigest()
              info = {}
              ip = f'dist/{n}-info.json'
              if os.path.exists(ip):
                  info = json.load(open(ip, encoding='utf-8'))
              out[n] = {
                  'file': os.path.basename(f),
                  'size': os.path.getsize(f),
                  'md5': h,
                  'version': info.get('version', ''),
                  'desc': info.get('desc', ''),
                  'bin': info.get('bin', ''),
              }
              new.append(n)
          os.makedirs('dist', exist_ok=True)
          json.dump(out, open('dist/summary.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1)
          print(f'本次更新 {len(new)} 个：{new}')
          print(f'清单总计 {len(out)} 个引擎')
          PY

      - name: 提交清单回仓库
        if: always()
        run: |
          mkdir -p built
          cp dist/summary.json built/summary.json 2>/dev/null || echo '{}' > built/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f built/summary.json
          git commit -m "引擎包构建清单 $(date -u +%FT%TZ)" || echo "无变化"
          git pull --rebase || true
          git push || echo "push 失败"
