name: 构建引擎包

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'trigger/build.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  TERMUX_MIRROR: 'https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main'
  TAG: 'v1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        engine:
          - aapt2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 deb
        uses: actions/cache@v4
        with:
          path: build/cache
          key: deb-${{ matrix.engine }}-${{ github.run_id }}
          restore-keys: |
            deb-${{ matrix.engine }}-
            deb-

      - name: 构建 ${{ matrix.engine }}
        working-directory: build
        run: |
          df -h / | tail -1
          python3 build_engine.py ${{ matrix.engine }}
          echo "--- 产物 ---"
          ls -la *.tar.gz
          cat ${{ matrix.engine }}-info.json

      - name: 校验包内容
        working-directory: build
        run: |
          set -uo pipefail
          mkdir -p /tmp/chk && tar xzf ${{ matrix.engine }}-engine.tar.gz -C /tmp/chk
          U=/tmp/chk/data/data/com.termux/files/usr
          echo "=== bin ==="
          ls -la $U/bin/ | head -20
          echo "=== lib 数量 ==="
          ls $U/lib/*.so* 2>/dev/null | wc -l
          echo "=== 顶层 ==="
          ls -la /tmp/chk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.engine }}
          path: |
            build/*-engine.tar.gz
            build/*-info.json
          retention-days: 7
          compression-level: 0

  release:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: 清单
        run: |
          echo "=== 构建结果 ==="
          ls -la dist/ || true
          for f in dist/*-engine.tar.gz; do
            [ -f "$f" ] || continue
            printf "%-28s %10d bytes\n" "$(basename $f)" "$(stat -c%s "$f")"
          done

      - name: 发布到 Release
        if: hashFiles('dist/*-engine.tar.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "引擎包 $TAG" --notes "编程专家 APP 引擎安装包"
          fi
          for f in dist/*-engine.tar.gz; do
            [ -f "$f" ] || continue
            echo "↑ $(basename $f)  $(stat -c%s "$f") bytes"
            gh release upload "$TAG" "$f" --clobber && echo "   OK" || echo "   FAIL"
          done
          echo ""
          echo "=== Release 资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
