name: sync-app-index

# 把最新版 index.html 同步到仓库根目录。
# 触发：改 app-url.txt 里的源地址并提交，或手动 Run workflow。
on:
  push:
    paths:
      - 'app-url.txt'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download index.html
        run: |
          URL="$(grep -v '^#' app-url.txt | head -1 | tr -d '\r\n ')"
          echo "源地址: $URL"
          curl -sSL --retry 3 --retry-delay 3 --max-time 180 -o index.html "$URL"
          SIZE=$(stat -c%s index.html)
          echo "下载大小: $SIZE 字节"
          head -c 80 index.html; echo
          if [ "$SIZE" -lt 100000 ]; then echo "::error::文件太小"; exit 1; fi
          if ! head -c 200 index.html | grep -qi '<!DOCTYPE html>'; then echo "::error::不是 HTML"; exit 1; fi
          grep -o "APP_VERSION='[^']*'" index.html | head -1

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync index.html from app-url.txt"
          file_pattern: index.html
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
