name: sync-app-index

# 把最新版 index.html 同步到 Release 资产，给 App 一个永久下载地址。
# 触发：改 app-url.txt 并提交，或手动 Run workflow。
# 为什么走 Release 不走分支：本仓库 Actions 推分支一直失败，
# 但 build-engines.yml 里的 gh release upload 长期稳定可用，故沿用。
#
# 产出资产（tag: app）：
#   index.html                     原始文件名
#   index_AICoder_latest.txt       永久链接，永远指向最新版
#   index_AICoder_v<版本>.txt      带版本号的快照
#   diag-app.txt                   下载诊断
on:
  push:
    branches: [main]
    paths:
      - 'app-url.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载并校验
        id: dl
        continue-on-error: true
        run: |
          : > diag-app.txt
          URL="$(grep -v '^#' app-url.txt | head -1 | tr -d '\r\n ')"
          echo "URL=$URL" >> diag-app.txt
          CODE=$(curl -sSL --retry 3 --retry-delay 3 --max-time 240 \
                 -o index.html -w '%{http_code}' "$URL" 2>>diag-app.txt) || CODE="curl_fail"
          echo "HTTP=$CODE" >> diag-app.txt
          SIZE=$(stat -c%s index.html 2>/dev/null || echo 0)
          echo "SIZE=$SIZE" >> diag-app.txt
          echo "MD5=$(md5sum index.html 2>/dev/null | cut -d' ' -f1)" >> diag-app.txt
          echo "HEAD:" >> diag-app.txt
          head -c 200 index.html 2>/dev/null >> diag-app.txt || true
          echo "" >> diag-app.txt
          grep -o "APP_VERSION='[^']*'" index.html 2>/dev/null | head -1 >> diag-app.txt || true
          cat diag-app.txt
          if [ "$SIZE" -lt 100000 ]; then echo "RESULT=too_small" >> diag-app.txt; exit 1; fi
          if ! head -c 400 index.html | grep -qi '<!DOCTYPE html>'; then echo "RESULT=not_html" >> diag-app.txt; exit 1; fi
          echo "RESULT=ok" >> diag-app.txt

      - name: 上传到 Release（App 前端）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! gh release view app >/dev/null 2>&1; then
            gh release create app --title "App 前端 index.html" \
              --notes "编程专家 App 的前端页面。index_AICoder_latest.txt 是永久链接，每次同步自动覆盖。"
          fi
          echo "--- 诊断 ---"
          cat diag-app.txt || true
          gh release upload app diag-app.txt --clobber && echo "diag OK" || echo "diag FAIL"

          if [ "${{ steps.dl.outcome }}" != "success" ]; then
            echo "下载未成功，本次只上传诊断"
            gh release view app
            exit 0
          fi

          cp index.html index_AICoder_latest.txt
          gh release upload app index.html index_AICoder_latest.txt --clobber \
            && echo "index.html + latest.txt OK" || echo "上传 FAIL"

          VER=$(grep -o "APP_VERSION='[^']*'" index.html | head -1 | sed "s/APP_VERSION='//; s/'$//" | cut -d'·' -f1)
          if [ -n "$VER" ]; then
            cp index.html "index_AICoder_v${VER}.txt"
            gh release upload app "index_AICoder_v${VER}.txt" --clobber \
              && echo "v${VER} 快照 OK" || echo "快照 FAIL"
          fi

          echo "--- 当前资产 ---"
          gh release view app
