name: sync-app-index

# 把最新版 index.html 同步到仓库根目录，同时把下载诊断写进 diag-run.txt。
# 触发：改 app-url.txt 并提交，或手动 Run workflow。
# 提交写法与 build-engines.yml 一致（该流程在本仓库已跑通，bot 提交正常）。
on:
  push:
    branches: [main]
    paths:
      - 'app-url.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 index.html
        id: dl
        continue-on-error: true
        run: |
          : > diag-run.txt
          URL="$(grep -v '^#' app-url.txt | head -1 | tr -d '\r\n ')"
          echo "URL=$URL" >> diag-run.txt
          CODE=$(curl -sSL --retry 3 --retry-delay 3 --max-time 240 \
                 -o index.html -w '%{http_code}' "$URL" 2>>diag-run.txt) || CODE="curl_fail"
          echo "HTTP=$CODE" >> diag-run.txt
          SIZE=$(stat -c%s index.html 2>/dev/null || echo 0)
          echo "SIZE=$SIZE" >> diag-run.txt
          echo "HEAD:" >> diag-run.txt
          head -c 200 index.html 2>/dev/null >> diag-run.txt || true
          echo "" >> diag-run.txt
          grep -o "APP_VERSION='[^']*'" index.html 2>/dev/null | head -1 >> diag-run.txt || true
          cat diag-run.txt
          if [ "$SIZE" -lt 100000 ]; then echo "RESULT=too_small" >> diag-run.txt; exit 1; fi
          if ! head -c 400 index.html | grep -qi '<!DOCTYPE html>'; then echo "RESULT=not_html" >> diag-run.txt; exit 1; fi
          echo "RESULT=ok" >> diag-run.txt

      - name: 提交回仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.dl.outcome }}" = "success" ] && [ -f index.html ]; then
            git add -f index.html
            echo "将提交 index.html ($(stat -c%s index.html) 字节)"
          else
            echo "下载未成功，本次只提交诊断"
            rm -f index.html
          fi
          git add -f diag-run.txt
          git commit -m "sync index.html $(date -u +%FT%TZ)" || echo "无变化"
          git pull --rebase || true
          git push || echo "push 失败"
