name: 构建 aapt2 引擎包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TERMUX_MIRROR: 'https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main'
  TAG: 'v1'

jobs:
  build:
    if: contains(github.event.head_commit.message, 'aapt2') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 deb
        uses: actions/cache@v4
        with:
          path: build/cache
          key: deb-aapt2-${{ github.run_id }}
          restore-keys: |
            deb-aapt2-
            deb-

      - name: 构建 aapt2
        working-directory: build
        run: |
          df -h / | tail -1
          python3 build_engine.py aapt2
          echo "--- 产物 ---"
          ls -la aapt2-engine.tar.gz
          cat aapt2-info.json

      - name: 校验包内容
        working-directory: build
        run: |
          set -uo pipefail
          mkdir -p /tmp/chk && tar xzf aapt2-engine.tar.gz -C /tmp/chk
          U=/tmp/chk/data/data/com.termux/files/usr
          echo "=== bin ==="
          ls -la $U/bin/aapt2 $U/bin/proot
          echo "=== lib 数量 ==="
          ls $U/lib/*.so* 2>/dev/null | wc -l
          echo "=== 顶层 ==="
          ls -la /tmp/chk

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          f=build/aapt2-engine.tar.gz
          [ -f "$f" ] || { echo "✗ 没有产物"; exit 1; }
          echo "↑ aapt2-engine.tar.gz  $(stat -c%s "$f") bytes"
          gh release upload "$TAG" "$f" --clobber && echo "   OK"
          echo ""
          echo "=== Release 资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)  \(.state)"'
