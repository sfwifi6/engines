name: 搬引擎包到 Releases

on:
  push:
    branches: [main]
    paths:
      - 'trigger/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（建议 v1）'
        required: true
        default: 'v1'

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || 'v1' }}
  UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载（逐项记录，不中断）
        run: |
          set -uo pipefail
          rm -f diag2.txt
          log(){ echo "$*" | tee -a diag2.txt; }

          log "# 下载 $(date -u +%FT%TZ)"
          dl() {
            log "↓ $1"
            local t0=$(date +%s)
            if curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                 --connect-timeout 30 --max-time 1800 \
                 -A "$UA" -o "$1" "$2"; then
              local t1=$(date +%s)
              log "   OK  $(stat -c%s "$1") bytes  $((t1-t0))s"
            else
              log "   FAIL code=$? $1"
            fi
          }

          # ========== 两个 Android 编译环境包 ==========
          # ① aide-engine：AIDE 风格（项目树模板 + aidec 一键编译 + textmate + ECJ）
          # ② androidsdk-engine：纯工具链（aapt2/zipalign/d8/apksigner/android.jar/keystore）
          #
          # 两个包都带完整 proot + busybox 运行时：
          #   bin/proot + bin/busybox + bin/sh
          #   libexec/proot/loader + loader32
          #   lib/libtalloc.so.2.5.0 + .so.2 + .so（三份真实文件，不是软链）
          #   lib/libandroid-shmem.so
          #   lib/libbusybox.so.1.38.0   ← busybox 本体（bin/busybox 只是 4KB 的壳）
          #   lib/libandroid-selinux.so  ← libbusybox 的依赖
          #   lib/libpcre2-8.so          ← libandroid-selinux 的依赖
          #
          # ⚠️ 一个字节都不能改：App 里硬编码了 size 和 md5 做校验
          # ⚠️ 包里 0 个软链 —— App 解压时 Os.symlink 失败会被 catch 静默吞掉，
          #    软链丢了 proot 就报 "No such file or directory"（找不到 libtalloc.so.2）
          #
          # aide-engine        size=39630828  md5=e55943c33c53f43436f73306a53af11a
          # androidsdk-engine  size=38858438  md5=88284ec440272f1416642854d31d3d58
          dl aide-engine.tar.gz "https://www.coze.cn/s/2RR9KLIRfpk/"
          dl androidsdk-engine.tar.gz "https://www.coze.cn/s/S6-dtHV25Qw/"

          # ---- 以下引擎包 Release v1 里都已经有了，需要重传时再放开 ----
          # dl python-engine.tar.gz "https://www.coze.cn/s/ZLt-OvAy3Vs/"
          #
          # dl clang.p00 "https://www.coze.cn/s/vo2llN8ZfBE/"
          # dl clang.p01 "https://www.coze.cn/s/wCLR287uFHE/"
          # if [ -f clang.p00 ] && [ -f clang.p01 ]; then
          #   cat clang.p00 clang.p01 > clang-engine.tar.gz && log "   merge clang OK $(stat -c%s clang-engine.tar.gz)"
          # fi
          # rm -f clang.p0*
          #
          # dl go.p00 "https://www.coze.cn/s/Nnz9_M2KLx4/"
          # dl go.p01 "https://www.coze.cn/s/Ad2nMbw527s/"
          # dl go.p02 "https://www.coze.cn/s/tnMmEE3VjFA/"
          # if [ -f go.p00 ] && [ -f go.p01 ] && [ -f go.p02 ]; then
          #   cat go.p00 go.p01 go.p02 > golang-engine.tar.gz && log "   merge golang OK $(stat -c%s golang-engine.tar.gz)"
          # fi
          # rm -f go.p0*
          #
          # dl jdk.p00 "https://www.coze.cn/s/ijOR7xqnvsc/"
          # dl jdk.p01 "https://www.coze.cn/s/7B0tCfYJflI/"
          # if [ -f jdk.p00 ] && [ -f jdk.p01 ]; then
          #   cat jdk.p00 jdk.p01 > openjdk-engine.tar.gz && log "   merge openjdk OK $(stat -c%s openjdk-engine.tar.gz)"
          # fi
          # rm -f jdk.p0*

          log ""
          log "## 结果"
          for f in *.tar.gz; do
            [ -f "$f" ] || continue
            log "$f  $(stat -c%s "$f")  $(md5sum "$f" | cut -d' ' -f1)"
          done

          log ""
          log "## 校验"
          FAIL=0
          chk() {
            local fn="$1" esz="$2" emd="$3"
            if [ ! -f "$fn" ]; then log "$fn  download_failed"; FAIL=1; return; fi
            local sz=$(stat -c%s "$fn"); local md=$(md5sum "$fn" | cut -d' ' -f1)
            log "$fn  SIZE=$sz  MD5=$md"
            if [ "$sz" = "$esz" ] && [ "$md" = "$emd" ]; then log "  -> verified"; else log "  -> mismatch"; FAIL=1; fi
          }
          chk aide-engine.tar.gz 39630828 e55943c33c53f43436f73306a53af11a
          chk androidsdk-engine.tar.gz 38858438 88284ec440272f1416642854d31d3d58
          if [ "$FAIL" != "0" ]; then log "RESULT=mismatch"; exit 1; fi
          log "RESULT=verified"

      - name: 发布 Release（逐个上传，不中断）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          log(){ echo "$*" | tee -a diag2.txt; }

          log ""
          log "# 发布 $(date -u +%FT%TZ)  tag=$TAG"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            log "创建 Release $TAG"
            gh release create "$TAG" --title "引擎包 $TAG" \
              --notes "编程专家 APP 语言引擎安装包（整包，不分卷，直接下）" 2>&1 | tee -a diag2.txt
          else
            log "Release $TAG 已存在"
          fi

          for f in *.tar.gz; do
            [ -f "$f" ] || continue
            log "↑ $f  $(stat -c%s "$f") bytes"
            if gh release upload "$TAG" "$f" --clobber 2>&1 | tee -a diag2.txt; then
              log "   OK"
            else
              log "   FAIL code=$?"
            fi
          done

          log ""
          log "## Release 资产"
          gh release view "$TAG" 2>&1 | tee -a diag2.txt

      - name: 提交诊断结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag2.txt || true
          git commit -m "搬运诊断 $(date -u +%FT%TZ)" || echo "无变化"
          git pull --rebase || true
          git push || echo "push 失败"
